syntax = "proto3";
package v12.headless;

// Basic chat payload
message ChatMessage {
  string user = 1;
  string text = 2;
  int64 timestamp = 3; // unix millis
}

// Minimal element description for sync
message ElementDto {
  string name = 1;
  string description = 2;
  string type = 3;
  int32 level = 4;
}
